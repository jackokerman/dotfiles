# =============================================================================
# Terminal and display
# =============================================================================

# Enable true color support (required for nightfly and other modern themes)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ',xterm-256color:Tc'

# Enable undercurl and colored underlines
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Reset terminal feature overrides before re-adding shared entries so reloading
# tmux.conf does not accumulate duplicate array values.
set -gu terminal-features

# Enable hyperlink (OSC 8) passthrough so Cmd+click works in Ghostty
set -ga terminal-features 'xterm*:hyperlinks'

# =============================================================================
# General settings
# =============================================================================

# Use Ctrl-a as prefix (easier to reach than Ctrl-b)
set -g prefix C-a
unbind C-b
bind -N "Send prefix to nested tmux" C-a send-prefix

# Nested tmux toggle (Ctrl+B suspends local tmux for remote sessions)
# Press Ctrl+B to toggle: local tmux goes passive, all keys pass to remote tmux.
# Press Ctrl+B again to restore local tmux control (for sesh, local splits, etc.)
#
# Nightfly palette reference:
#   #011627 = black (editor bg)    #092236 = dark blue (status bg)
#   #4b6479 = steel blue (muted)   #82aaff = blue (accent)
#   #9fa8b6 = cadet blue (fg)      #f78c6c = orange (prefix indicator)
bind -N "Enter nested tmux pass-through mode" -T root C-b \
  set prefix None \;\
  set key-table off \;\
  set status-style "bg=#011627,fg=#4b6479" \;\
  set status-left "#[fg=#4b6479]⠶ #S " \;\
  setw window-status-current-style "bg=#092236,fg=#4b6479" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -N "Exit nested tmux pass-through mode" -T off C-b \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u status-left \;\
  setw -u window-status-current-style \;\
  refresh-client -S

# Reduce escape delay (important for vim/neovim)
set -g escape-time 0

# Increase scrollback history
set -g history-limit 50000

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable mouse support (scroll, click to select pane, resize panes)
setw -g mouse on

# Enable system clipboard integration, including OSC 52 copies across nested
# local/remote tmux sessions when the terminal supports it.
set -g set-clipboard on
set -g allow-passthrough on
set -ga terminal-features ',*:clipboard'

# Focus events for vim/neovim autocommands
set -g focus-events on

# Vi mode for copy mode and status line
setw -g mode-keys vi
set -g status-keys vi

# =============================================================================
# Key bindings
# =============================================================================

# Kill pane without confirmation prompt
bind -N "Kill current pane" x kill-pane

# Stay in tmux when destroying a session (switch to another instead of detaching)
set -g detach-on-destroy off

# Reload config
bind -N "Reload tmux config" r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Splits: | for horizontal, - for vertical (preserve working directory)
unbind %
unbind '"'
bind -N "Split pane horizontally" | split-window -h -c "#{pane_current_path}"
bind -N "Split pane vertically" - split-window -v -c "#{pane_current_path}"

# New window preserving working directory
unbind c
bind -N "Create a new window in the current path" c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind -N "Focus pane to the left" h select-pane -L
bind -N "Focus pane below" j select-pane -D
bind -N "Focus pane above" k select-pane -U
bind -N "Focus pane to the right" l select-pane -R

# Pane resizing (repeatable)
bind -N "Resize pane left by 5" -r H resize-pane -L 5
bind -N "Resize pane down by 5" -r J resize-pane -D 5
bind -N "Resize pane up by 5" -r K resize-pane -U 5
bind -N "Resize pane right by 5" -r L resize-pane -R 5

# Toggle zoom on current pane
bind -N "Toggle pane zoom" -r m resize-pane -Z

# Copy mode: v to select, y to copy (like vim)
bind -N "Start selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection and exit copy mode" -T copy-mode-vi y send -X copy-selection-and-cancel

# Switch to last session (via sesh)
bind -N "Switch to the last session" Tab run-shell "sesh last"

# Session picker (sesh + fzf in a tmux popup)
# C-t in root table so it works without prefix, and in off table so it reaches
# the local sesh even when keys are passing through to the remote tmux.
bind -N "Open the session picker popup" -T root C-t display-popup -E -w 55% -h 60% 'sesh-pick'
bind -N "Open the session picker popup" -T off  C-t display-popup -E -w 55% -h 60% 'sesh-pick'
bind -N "Open the session picker popup" T display-popup -E -w 55% -h 60% 'sesh-pick'

# Fleet dashboard popup and sidebar. The popup intentionally matches the sesh
# popup dimensions above.
unbind -q -T root C-f
unbind -q -T off C-f
bind -N "Open the Fleet dashboard popup" F display-popup -E -w 55% -h 60% 'fleet'
bind -N "Toggle the Fleet sidebar" f run-shell "fleet sidebar --from '#{pane_id}'"
bind -N "Jump to the next waiting Fleet agent" n run-shell "fleet next"

# Theme (nightfly)
source-file ~/.config/tmux/themes/nightfly.tmux
run-shell "fleet statusline --inject" # fleet-managed

# Local overrides (loaded from overlay repos if present)
if-shell '[ -f ~/.config/tmux/tmux.local.conf ]' 'source-file ~/.config/tmux/tmux.local.conf'
